name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag matches the crate version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          fi

      - name: CHANGELOG.md has notes for this release
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format, lint and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets

  addon:
    name: Package Godot addon
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package addon archive
        run: zip -r godot-dev-bridge-addon.zip addons/godot_dev_bridge

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: godot-dev-bridge-addon.zip
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: godot-dev-bridge.exe
            archive_ext: zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: godot-dev-bridge
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: godot-dev-bridge
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: godot-dev-bridge
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "${{ github.workspace }}/godot-dev-bridge-${{ matrix.target }}.tar.gz" ${{ matrix.bin }}

      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath "godot-dev-bridge-${{ matrix.target }}.zip"

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: godot-dev-bridge-${{ matrix.target }}.*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
