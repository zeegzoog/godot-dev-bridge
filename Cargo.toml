[package]
name = "godot-dev-bridge"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Oleg Alexandrov <alexandrovoleg.ru@gmail.com>"]
description = "Drive a running Godot game from a shell: hold it still, step it by exact ticks, inject input, read state, take screenshots"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zigenzoog/godot-dev-bridge"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
